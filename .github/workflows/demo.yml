name: Drive HeyClicky demo (audio)

# Signs the app in (token callback, same as signin.yml), waits for the
# post-sign-in survey, then posts a synthetic mouse click at a given coordinate
# with cliclick (which uses CGEventPost and does not need Accessibility to POST
# events), and screenshots the result. Coordinates are in the 1024x768 capture
# space. Manual trigger.

on:
  workflow_dispatch:
    inputs:
      clicks:
        description: "Semicolon-separated x,y clicks in 1024x768 space, applied in order"
        default: "517,486;483,421"
      dmg_url:
        description: "Direct .dmg URL (blank = Sparkle appcast). Default pinned to v1.0.48: the driver's clicks were built for this build — 1.0.49+ add a 'Pick the style' screen and a different screen-access flow."
        required: false
        default: "https://github.com/farzaa/clicky-releases/releases/download/v1.0.48/HeyClicky.dmg"

jobs:
  interact:
    runs-on: macos-latest
    timeout-minutes: 40   # hard cap so a wedged step can never hang for hours
    steps:
      - name: Environment
        run: |
          sw_vers; uname -m

      - name: Install cliclick
        run: brew install --quiet cliclick || brew install cliclick || true

      - name: Install audio tooling (do NOT change default device yet)
        run: |
          set -x
          brew install --quiet coreutils || brew install coreutils || true          # gtimeout
          brew install --quiet ffmpeg || brew install ffmpeg || true                 # stitch frames
          brew install --quiet switchaudio-osx || brew install switchaudio-osx || true
          brew install --quiet blackhole-2ch || brew install --cask blackhole-2ch || true
          # Register the new HAL device with a single coreaudiod restart NOW, well
          # before the app launches, so the restart never races the app's audio
          # init (that race broke auth). Crucially we leave the DEFAULT input/output
          # untouched here, so the app launches + authenticates on the normal
          # device; we only switch to BlackHole later, at the mic step.
          sudo killall coreaudiod 2>/dev/null || true
          sleep 5
          echo "--- audio devices ---"; SwitchAudioSource -a || true
          # ---- Disable the macOS "press Control twice" Dictation shortcut ----
          # Control-twice is HeyClicky's text trigger, but macOS claims it for
          # Dictation and pops a system prompt that steals the gesture. Turn the
          # OS dictation shortcut/feature off (before the app launches) so the
          # Control-twice reaches HeyClicky instead.
          defaults write com.apple.HIToolbox AppleDictationAutoEnable -bool false 2>/dev/null || true
          defaults write com.apple.assistant.support "Dictation Enabled" -bool false 2>/dev/null || true
          defaults write com.apple.speech.recognition.AppleSpeechRecognition.prefs DictationIMMasterDictationEnabled -bool false 2>/dev/null || true
          # Dictation "key identifier" 0 = no double-press shortcut.
          defaults write com.apple.HIToolbox AppleDictationKeyIdentifier -int 0 2>/dev/null || true
          killall cfprefsd 2>/dev/null || true
          # One clip per demo step's spoken interaction.
          say -o "$HOME/clip.aiff"    "Testing, testing, one two three. Hey Clicky, can you hear me now?" || true
          say -o "$HOME/name.aiff"    "Hi, my name is Yohoji." || true
          say -o "$HOME/draw.aiff"    "Find and draw something interesting on my screen." || true
          say -o "$HOME/circle.aiff"  "What is this thing I circled? Tell me about it." || true
          say -o "$HOME/dictate.aiff" "This is a dictation test. Please type this sentence out for me." || true
          ls -l "$HOME"/*.aiff || true

      - name: Fetch the app
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.dmg_url }}"
          if [ -z "$URL" ]; then
            curl -fsSL https://farzaa.github.io/clicky-releases/appcast.xml -o appcast.xml
            URL=$(grep -oE 'url="https://[^"]+\.dmg"' appcast.xml | head -1 | sed 's/url="//; s/"$//')
          fi
          curl -fL "$URL" -o HeyClicky.dmg
          MP=$(mktemp -d); hdiutil attach HeyClicky.dmg -nobrowse -mountpoint "$MP"
          cp -R "$(find "$MP" -maxdepth 1 -name '*.app' | head -1)" "$HOME/HeyClicky.app"
          hdiutil detach "$MP" || true
          xattr -dr com.apple.quarantine "$HOME/HeyClicky.app" || true

      - name: Launch, sign in, drive to Allow, observe
        env:
          AT: ${{ secrets.CLICKY_ACCESS_TOKEN }}
          RT: ${{ secrets.CLICKY_REFRESH_TOKEN }}
        run: |
          set -x
          [ -n "$AT" ] && [ -n "$RT" ] || { echo "Missing token secrets"; exit 1; }
          mkdir -p evidence/shots
          # Vision helper (Swift, so no pip — macOS runners use an externally
          # managed Python that rejects pip installs). The onboarding card renders
          # at a different position on every launch, so fixed coords miss. We
          # locate the target in a fresh screenshot each time. "blue" finds the
          # accent-blue dot or button (the only saturated blue on a black screen,
          # dock/menubar excluded); "allow" finds the light macOS TCC dialog and
          # returns its bottom-right button. Output is X,Y in 1024x768 space.
          cat > /tmp/find_target.swift <<'SW'
          import AppKit
          import Foundation
          let a = CommandLine.arguments
          guard a.count >= 3, let img = NSImage(contentsOfFile: a[1]) else { print("NONE"); exit(0) }
          let mode = a[2]
          var pr = NSRect(x: 0, y: 0, width: img.size.width, height: img.size.height)
          guard let cg = img.cgImage(forProposedRect: &pr, context: nil, hints: nil) else { print("NONE"); exit(0) }
          let rep = NSBitmapImageRep(cgImage: cg)
          let W = rep.pixelsWide, H = rep.pixelsHigh
          guard let data = rep.bitmapData else { print("NONE"); exit(0) }
          let spp = rep.samplesPerPixel, bpr = rep.bytesPerRow
          let sx = 1024.0 / Double(W), sy = 768.0 / Double(H)
          func rgb(_ x: Int, _ y: Int) -> (Int, Int, Int) {
            let o = y * bpr + x * spp
            return (Int(data[o]), Int(data[o + 1]), Int(data[o + 2]))
          }
          // Collect light (system-dialog) pixels and accent-blue pixels in one pass.
          var lx = [Int](); var ly = [Int]()      // light dialog
          var bx = [Int](); var by = [Int]()      // accent blue (buttons/dots)
          let yl0 = Int(Double(H) * 0.05), yl1 = Int(Double(H) * 0.85)   // dialog band
          let yb0 = Int(Double(H) * 0.10), yb1 = Int(Double(H) * 0.88)   // button band (skip notch)
          var y = yl0
          while y < yb1 {
            var x = 0
            while x < W {
              let (r, g, b) = rgb(x, y)
              if y >= yl0 && y < yl1 && r > 205 && g > 205 && b > 205 { lx.append(x); ly.append(y) }
              if y >= yb0 && y < yb1 && b > 140 && b > r + 50 && b > g + 30 && r < 120 { bx.append(x); by.append(y) }
              x += 2
            }
            y += 2
          }
          func fmt(_ cx: Double, _ cy: Double) -> String { "\(Int((cx * sx).rounded())),\(Int((cy * sy).rounded()))" }
          func blueTarget(minWidth: Double = 0, xFrac: Double? = nil,
                          yMinFrac: Double? = nil, solidFill: Double = 0) -> String? {
            // Optional region filter: in the demo phase the browser (Gmail)
            // sits behind the card and its own blue buttons ("Next",
            // "Forgot email?") must never be targets.
            var fx = [Int](); var fy = [Int]()
            if xFrac != nil || yMinFrac != nil {
              for i in 0..<bx.count {
                let px = Double(bx[i]) / Double(W), py = Double(by[i]) / Double(H)
                if let xf = xFrac, px < xf || px > 1.0 - xf { continue }
                if let ym = yMinFrac, py < ym { continue }
                fx.append(bx[i]); fy.append(by[i])
              }
            } else { fx = bx; fy = by }
            if fx.count < 25 { return nil }
            let band = Int(Double(H) * 0.05); let ymax = fy.max() ?? 0
            var cbx = [Int](); var cby = [Int]()
            for i in 0..<fy.count where fy[i] >= ymax - band { cbx.append(fx[i]); cby.append(fy[i]) }
            // minWidth: reject narrow blue blobs — the app's wandering cursor
            // triangle is ~20px wide; a real card button is 100+.
            if minWidth > 0, let lo = cbx.min(), let hi = cbx.max(), Double(hi - lo) * sx < minWidth { return nil }
            // solidFill: a solid button fills its bbox (~0.8); thin blue text
            // ("Forgot email?") fills ~0.35 and a triangle ~0.4. Samples are
            // on a 2x2 grid, so each one stands for 4 px.
            if solidFill > 0, let lo = cbx.min(), let hi = cbx.max(),
               let ylo = cby.min(), let yhi = cby.max() {
              let area = Double((hi - lo + 2) * (yhi - ylo + 2))
              if area > 0, Double(cbx.count) * 4.0 / area < solidFill { return nil }
            }
            return fmt(Double(cbx.reduce(0, +)) / Double(cbx.count), Double(cby.reduce(0, +)) / Double(cby.count))
          }
          // The tutorial's END card ("Okay, let me show you around" + the white
          // "Show me" pill) hangs from y=0 to ~15% height. Three gates:
          //   1. a dark card must fill the top-centre strip (no card -> nothing
          //      to click; Safari chrome must not be mistaken for the pill),
          //   2. a dark card extending well BELOW the strip = the guided demo
          //      is already playing -> NEVER touch it (never skip),
          //   3. the pill's lower rows have card-dark 15px below them (the
          //      white title text does not; it also sits above the scan band).
          // Measured on run 34787663323 tutorial-end.png: card x 283-741,
          // y 0-118; pill x 462-562, y 61-89; title whites y 12-27.
          func showmeTarget() -> String? {
            let xL = Int(Double(W) * 0.28), xR = Int(Double(W) * 0.72)
            var dark = 0, total = 0
            var y = Int(Double(H) * 0.04)
            let yStrip = Int(Double(H) * 0.15)
            while y < yStrip {
              var x = xL
              while x < xR {
                let (r, g, b) = rgb(x, y); total += 1
                if r < 70 && g < 70 && b < 70 { dark += 1 }
                x += 4
              }
              y += 4
            }
            if total == 0 || dark * 4 < total * 3 { return nil }
            var tallDark = 0
            let yT0 = Int(Double(H) * 0.18), yT1 = Int(Double(H) * 0.31)
            let xTL = Int(Double(W) * 0.34), xTR = Int(Double(W) * 0.66)
            y = yT0
            while y < yT1 {
              var x = xTL
              while x < xTR {
                let (r, g, b) = rgb(x, y)
                if r < 70 && g < 70 && b < 70 { tallDark += 1 }
                x += 4
              }
              y += 4
            }
            if tallDark > 150 { return nil }   // demo card in progress — hands off
            var pxs = [Int](); var pys = [Int]()
            let yP0 = Int(Double(H) * 0.055), yP1 = Int(Double(H) * 0.125)
            let d = Int(Double(H) * 0.02)
            y = yP0
            while y < yP1 {
              var x = xL
              while x < xR {
                let (r, g, b) = rgb(x, y)
                if r > 185 && g > 185 && b > 185 {
                  let (r2, g2, b2) = rgb(x, min(H - 1, y + d))
                  if r2 < 90 && g2 < 90 && b2 < 90 { pxs.append(x); pys.append(y) }
                }
                x += 2
              }
              y += 2
            }
            if pys.count < 30 { return nil }
            let band = Int(Double(H) * 0.012); let ymax = pys.max() ?? 0
            var bx2 = [Int](); var by2 = [Int]()
            for i in 0..<pys.count where pys[i] >= ymax - band { bx2.append(pxs[i]); by2.append(pys[i]) }
            return fmt(Double(bx2.reduce(0, +)) / Double(bx2.count), Double(by2.reduce(0, +)) / Double(by2.count))
          }
          // Light-region bbox (as fractions of the screen). Used to tell a small
          // centred TCC dialog from a big browser page (Safari during the tutorial).
          func lightBox() -> (Double, Double, Double, Double, Double, Double)? {
            if lx.count < 800 { return nil }
            let sxs = lx.sorted(), sys2 = ly.sorted()
            func pct(_ arr: [Int], _ p: Double) -> Double { Double(arr[Int(Double(arr.count) * p)]) }
            let xlo = pct(sxs, 0.05), xhi = pct(sxs, 0.95), ylo = pct(sys2, 0.05), yhi = pct(sys2, 0.95)
            return (xlo, xhi, ylo, yhi, (xhi - xlo) / Double(W), (yhi - ylo) / Double(H))
          }
          func dialogTarget(_ minC: Int) -> String? {
            guard lx.count >= minC, let (xlo, xhi, ylo, yhi, wf, hf) = lightBox() else { return nil }
            if wf > 0.45 || hf > 0.60 { return nil }   // too big to be a dialog (browser)
            let cxf = (xlo + xhi) / 2.0 / Double(W)
            if cxf < 0.35 || cxf > 0.65 { return nil } // off-centre => a macOS notification banner, not a TCC prompt
            return fmt(xlo + 0.73 * (xhi - xlo), ylo + 0.86 * (yhi - ylo))   // Allow: right-of-centre, near bottom
          }
          switch mode {
          case "blue":  print(blueTarget() ?? "NONE")
          case "allow": print(dialogTarget(800) ?? "NONE")
          case "showme": print(showmeTarget() ?? "NONE")
          case "card":  // demo phase (Safari may be behind the card): a TCC
                        // dialog, or a real card button — bottom-centre of the
                        // notch card, blue, wide and solid (not the cursor
                        // triangle, not Gmail's own "Next"/"Forgot email?").
            if let d = dialogTarget(1500) { print("dialog \(d)") }
            else if let b = blueTarget(minWidth: 40, xFrac: 0.26, yMinFrac: 0.55,
                                       solidFill: 0.5) { print("blue \(b)") }
            else { print("none") }
          default:      // "classify": what is on screen + where to click
            // A big light region = Safari/browser page => the tutorial has started
            // => onboarding is done. Report it so the driver stops onboarding.
            if let (_, _, _, _, wf, hf) = lightBox(), wf > 0.45 || hf > 0.60 { print("browser") }
            else if let d = dialogTarget(1500) { print("dialog \(d)") }
            else if let b = blueTarget()  { print("blue \(b)") }
            else { print("none") }
          }
          SW
          cat > /tmp/ax_driver.swift <<'SW2'
          import AppKit
          import ApplicationServices

          // Usage: ax_driver trusted | dump | press <query> | find <query>
          // Walks the Accessibility tree of com.humansongs.clicky. press/find
          // match an AXButton/AXLink/AXMenuItem whose title/description/value
          // contains the query (case-insensitive). AX coords are global screen
          // points — the same space cliclick uses.
          let args = CommandLine.arguments
          guard args.count >= 2 else { print("USAGE"); exit(0) }
          let mode = args[1]
          let query = args.count > 2 ? args[2].lowercased() : ""

          func trustedNow() -> Bool {
            let k = kAXTrustedCheckOptionPrompt.takeUnretainedValue() as String
            return AXIsProcessTrustedWithOptions([k: false] as CFDictionary)
          }
          if mode == "trusted" { print(trustedNow() ? "YES" : "NO"); exit(0) }

          let apps = NSRunningApplication.runningApplications(
            withBundleIdentifier: "com.humansongs.clicky")
          guard let app = apps.first else { print("NOPID"); exit(0) }
          let appEl = AXUIElementCreateApplication(app.processIdentifier)

          func axStr(_ el: AXUIElement, _ a: String) -> String? {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(el, a as CFString, &v) == .success else { return nil }
            return v as? String
          }
          func axChildren(_ el: AXUIElement) -> [AXUIElement] {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(el, kAXChildrenAttribute as CFString, &v) == .success,
                  let arr = v as? [AXUIElement] else { return [] }
            return arr
          }
          func axEnabled(_ el: AXUIElement) -> Bool {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(el, kAXEnabledAttribute as CFString, &v) == .success,
                  let b = v as? Bool else { return true }
            return b
          }
          func axPoint(_ el: AXUIElement) -> CGPoint? {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(el, kAXPositionAttribute as CFString, &v) == .success,
                  let cv = v, CFGetTypeID(cv) == AXValueGetTypeID(),
                  AXValueGetType(cv as! AXValue) == .cgPoint else { return nil }
            var p = CGPoint.zero
            AXValueGetValue(cv as! AXValue, .cgPoint, &p)
            return p
          }
          func axSize(_ el: AXUIElement) -> CGSize? {
            var v: CFTypeRef?
            guard AXUIElementCopyAttributeValue(el, kAXSizeAttribute as CFString, &v) == .success,
                  let cv = v, CFGetTypeID(cv) == AXValueGetTypeID(),
                  AXValueGetType(cv as! AXValue) == .cgSize else { return nil }
            var s = CGSize.zero
            AXValueGetValue(cv as! AXValue, .cgSize, &s)
            return s
          }
          func click(_ p: CGPoint) {
            for t in [CGEventType.leftMouseDown, .leftMouseUp] {
              if let e = CGEvent(mouseEventSource: nil, mouseType: t,
                                 mouseCursorPosition: p, mouseButton: .left) {
                e.post(tap: .cghidEventTap)
                usleep(70000)
              }
            }
          }

          struct Hit { let el: AXUIElement; let role: String; let label: String
                       let pos: CGPoint; let size: CGSize; let enabled: Bool }
          var hits: [Hit] = []
          var visited = 0
          func walk(_ el: AXUIElement, _ depth: Int) {
            guard visited < 1500, hits.count < 60 else { return }
            visited += 1
            let role = axStr(el, kAXRoleAttribute) ?? "?"
            var parts: [String] = []
            if let t = axStr(el, kAXTitleAttribute), !t.isEmpty { parts.append(t) }
            if let d = axStr(el, kAXDescriptionAttribute), !d.isEmpty { parts.append(d) }
            if let w = axStr(el, kAXValueAttribute), !w.isEmpty { parts.append(w) }
            let label = String(parts.joined(separator: " | ").prefix(120))
            let pos = axPoint(el) ?? CGPoint(x: -1, y: -1)
            let size = axSize(el) ?? CGSize(width: -1, height: -1)
            let enabled = axEnabled(el)
            if mode == "dump" {
              let ind = String(repeating: "  ", count: min(depth, 10))
              print("\(ind)\(role) [\(enabled ? "on" : "off")] '\(label)' @ \(Int(pos.x)),\(Int(pos.y)) \(Int(size.width))x\(Int(size.height))")
            }
            if !query.isEmpty,
               role == "AXButton" || role == "AXLink" || role == "AXMenuItem" {
              if label.lowercased().contains(query) {
                hits.append(Hit(el: el, role: role, label: label,
                                pos: pos, size: size, enabled: enabled))
              }
            }
            for c in axChildren(el) { walk(c, depth + 1) }
          }

          walk(appEl, 0)
          switch mode {
          case "dump":
            if visited <= 1 { print("EMPTY-TREE trusted=\(trustedNow()) scanned=\(visited)") }
          case "press", "find":
            if visited <= 1 { print("EMPTY-TREE trusted=\(trustedNow()) scanned=\(visited)"); exit(0) }
            guard let b = (hits.filter { $0.enabled }.first ?? hits.first) else {
              print("NOTFOUND trusted=\(trustedNow()) scanned=\(visited)"); exit(0)
            }
            let cx = Int(b.pos.x + b.size.width / 2), cy = Int(b.pos.y + b.size.height / 2)
            if mode == "find" { print("\(cx),\(cy)"); exit(0) }
            if b.enabled, AXUIElementPerformAction(b.el, kAXPressAction as CFString) == .success {
              print("PRESSED \(b.role) '\(b.label.prefix(60))' at \(cx),\(cy)")
            } else if b.enabled {
              click(CGPoint(x: Double(cx), y: Double(cy)))
              print("CLICKED \(b.role) '\(b.label.prefix(60))' at \(cx),\(cy)")
            } else {
              print("PRESS-FAILED \(b.role) '\(b.label.prefix(60))' enabled=false at \(cx),\(cy)")
            }
          default:
            print("USAGE"); exit(0)
          }
          SW2
          # ---- Pre-grant Accessibility with a real csreq, before launch ------
          # A bare TCC row (csreq NULL) is inert: tccd verifies the requesting
          # app's signature against the stored csreq blob, so a signed app is not
          # trusted without it. Compute HeyClicky's designated requirement, turn
          # it into the binary csreq blob, and inject the Accessibility row WITH
          # that blob before first launch so AXIsProcessTrusted reads true when
          # the app checks it. (User approved this TCC write on a throwaway VM.)
          BID=com.humansongs.clicky
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          : > evidence/tcc_write.log
          REQ=$(codesign -d -r- "$HOME/HeyClicky.app" 2>&1 | sed -n 's/^designated => //p')
          echo "designated requirement: $REQ" | tee -a evidence/tcc_write.log
          CSHEX=""
          if [ -n "$REQ" ]; then
            printf '%s' "$REQ" | csreq -r- -b /tmp/req.csreq 2>>evidence/tcc_write.log \
              && CSHEX=$(xxd -p /tmp/req.csreq | tr -d '\n')
          fi
          echo "csreq blob hex length: ${#CSHEX}" | tee -a evidence/tcc_write.log
          if [ -n "$CSHEX" ]; then
            # Accessibility is needed just to reach the Screen Recording screen
            # (each runner starts with an empty TCC.db); ScreenCapture is the one
            # we're actually testing — grant it before launch so the app reads it
            # at startup (Screen Recording is otherwise cached until relaunch).
            for SVC in kTCCServiceAccessibility kTCCServiceScreenCapture; do
              sudo sqlite3 "$SYS" \
                "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags) VALUES ('$SVC','$BID',0,2,4,1,X'$CSHEX',0);" \
                >>evidence/tcc_write.log 2>&1 && echo "$SVC INSERT OK (with csreq)" | tee -a evidence/tcc_write.log \
                || echo "$SVC INSERT FAILED" | tee -a evidence/tcc_write.log
            done
          else
            echo "no csreq blob; skipping csreq-based insert" | tee -a evidence/tcc_write.log
          fi
          sudo sqlite3 "$SYS" "SELECT service,client,auth_value,length(csreq) FROM access WHERE client='$BID';" | tee -a evidence/tcc_write.log
          sudo killall tccd 2>/dev/null || true
          sleep 3
          # ---- AX driver: build + self-grant Accessibility ------------------
          # If HeyClicky's cards are AX-exposed (SwiftUI usually is), pressing
          # buttons by accessibility tree is exact: no coords, no pixel
          # thresholds, and AXEnabled tells us when a disabled Continue has
          # genuinely enabled (mic bars live). The runner's TCC.db starts
          # empty every run, so grant the freshly compiled ad-hoc driver (and
          # osascript as a backup client) their own Accessibility rows. If
          # trusted=NO we simply fall back to pixel mode.
          echo "--- building AX driver ---"
          if swiftc /tmp/ax_driver.swift -o /tmp/ax_driver 2>/tmp/axc.log; then
            codesign --force --sign - /tmp/ax_driver 2>/dev/null || true
            AXROW=""; AXOSA=""
            REQ=$(codesign -d -r- /tmp/ax_driver 2>&1 | sed -n 's/^designated => //p')
            [ -n "$REQ" ] && printf '%s' "$REQ" | csreq -r- -b /tmp/axd.csreq 2>/dev/null \
              && AXROW=$(xxd -p /tmp/axd.csreq | tr -d '\n')
            OREQ=$(codesign -d -r- /usr/bin/osascript 2>&1 | sed -n 's/^designated => //p')
            [ -n "$OREQ" ] && printf '%s' "$OREQ" | csreq -r- -b /tmp/osa.csreq 2>/dev/null \
              && AXOSA=$(xxd -p /tmp/osa.csreq | tr -d '\n')
            if [ -n "$AXROW" ]; then
              sudo sqlite3 "$SYS" \
                "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags) VALUES ('kTCCServiceAccessibility','/tmp/ax_driver',1,2,4,1,X'$AXROW',0);" \
                && echo "ax_driver Accessibility row OK"
            fi
            if [ -n "$AXOSA" ]; then
              sudo sqlite3 "$SYS" \
                "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags) VALUES ('kTCCServiceAccessibility','/usr/bin/osascript',1,2,4,1,X'$AXOSA',0);" \
                && echo "osascript Accessibility row OK"
            fi
            sudo killall tccd 2>/dev/null || true
            sleep 2
            echo "AX trusted: $(/tmp/ax_driver trusted 2>/dev/null || echo no-driver)"
          else
            cat /tmp/axc.log || true
            echo "AX driver build FAILED; pixel fallback only"
          fi
          # ---- FULL-RUN screen recording (frame burst) ---------------------
          # Record the ENTIRE run by bursting screenshots (screencapture -x can
          # never wedge, unlike screencapture -V which hung on the audio device).
          # Stitched into an mp4 with ffmpeg at the end.
          TO=$(command -v gtimeout || command -v timeout || true)
          run_to() { if [ -n "$TO" ]; then "$TO" "$@"; else shift; "$@"; fi; }
          mkdir -p /tmp/frames
          ( fi=0; while :; do fi=$((fi+1)); screencapture -x "$(printf /tmp/frames/f_%05d.png "$fi")" 2>/dev/null; sleep 1; done ) &
          FULLVID=$!
          # ALSO record a real-time screen+AUDIO capture (ffmpeg avfoundation) so we
          # can HEAR the app speak. Audio comes from BlackHole (where the app's TTS
          # and the fed clip both play). May be black if ffmpeg lacks Screen
          # Recording; the frame burst above is the reliable video-only fallback.
          echo "--- avfoundation devices ---"; ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | grep -iE "screen|blackhole" || true
          # Record to .mkv: Matroska stays playable even if the recorder is cut
          # off (mp4 needs a clean finalize for its moov atom, which SIGKILL broke).
          ffmpeg -nostdin -y -f avfoundation -capture_cursor 1 -framerate 12 \
            -i "Capture screen 0:BlackHole 2ch" -t 1500 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -c:a aac \
            evidence/av.mkv > evidence/av.log 2>&1 &
          AVVID=$!
          open "$HOME/HeyClicky.app"
          sleep 18
          { set +x; } 2>/dev/null
          open "clicky://auth-callback#access_token=${AT}&refresh_token=${RT}&expires_in=3600&token_type=bearer"
          set -x
          # AUTH GATE: do not click until the injected session has actually signed
          # the app in. Otherwise the first clicks land on the "Sign in with
          # Google" button, the app opens browser OAuth, and onboarding derails.
          # Poll the app's own log for the authenticated marker before proceeding.
          echo "waiting for authentication to take effect before clicking..."
          # Cheap, bounded gate: 'log show --last 40s' (no --info) is fast; cap at
          # ~90s so a failed auth can't eat the job budget and get us cancelled.
          AUTHED=0
          for i in $(seq 1 30); do
            # --info/--debug: on v1.0.48 the marker logs at info level, which a
            # default-level `log show` never returns (run 34904667774's false WARN).
            if log show --predicate 'subsystem == "com.humansongs.clicky"' --info --debug --last 40s 2>/dev/null | grep -qiE "authenticated as|signed in"; then
              echo "auth confirmed after ~$((i*3))s"; AUTHED=1; break
            fi
            sleep 3
          done
          if [ "$AUTHED" != 1 ]; then
            # The first callback can be lost if it races the app's URL-scheme
            # registration right after launch. Re-fire it once before giving up.
            echo "auth not confirmed yet; re-firing the token callback once"
            { set +x; } 2>/dev/null
            open "clicky://auth-callback#access_token=${AT}&refresh_token=${RT}&expires_in=3600&token_type=bearer"
            set -x
            for i in $(seq 1 20); do
              if log show --predicate 'subsystem == "com.humansongs.clicky"' --info --debug --last 40s 2>/dev/null | grep -qiE "authenticated as|signed in"; then
                echo "auth confirmed on retry after ~$((i*3))s"; AUTHED=1; break
              fi
              sleep 3
            done
          fi
          [ "$AUTHED" = 1 ] || echo "WARN: auth marker not seen after retry; proceeding anyway"
          sleep 12   # let the post-sign-in survey render and settle
          screencapture -x evidence/shots/00-start.png 2>/dev/null || true
          /tmp/ax_driver dump > evidence/ax-early-tree.log 2>/dev/null || true
          # ---- STATE-AWARE onboarding driver ------------------------------
          # Instead of a rigid step sequence (which desynced when a screen — e.g.
          # the mic prompt — appeared late and got skipped, leaving it unclicked),
          # loop: look at what is ACTUALLY on screen and act.
          #   dialog -> click its Allow button (handles the mic + bypass prompts
          #             WHENEVER they appear, no timing assumption)
          #   blue   -> click the blue button/dot (color pick, Give me a home,
          #             Let's start, Grant Microphone, Grant Access, Meet HeyClicky)
          #   none   -> early: it's the survey (no blue button) -> click "Claude";
          #             late (after we have advanced): the tutorial has started ->
          #             onboarding is done.
          # This self-recovers: a late dialog is simply clicked on a later loop.
          advanced=0
          noneStreak=0
          lastXY=""
          for i in $(seq 1 60); do
            screencapture -x /tmp/cur.png 2>/dev/null || true
            R=$(swift /tmp/find_target.swift /tmp/cur.png classify 2>/dev/null || echo none)
            MODE="${R%% *}"; XY="${R#* }"
            echo "onboard iter $i: $R"
            done_onboard=0
            case "$MODE" in
              browser)
                # Safari is open => the intro tutorial has started => onboarding
                # is finished. (Only trust this once we've actually advanced.)
                [ "$advanced" -ge 5 ] && done_onboard=1 ;;
              dialog)
                cliclick c:${XY%,*},${XY#*,} || true
                advanced=$((advanced+1)); noneStreak=0 ;;
              blue)
                # avoid hammering the exact same spot forever (stuck) — still click,
                # but count repeats toward the done heuristic.
                cliclick c:${XY%,*},${XY#*,} || true
                [ "$XY" = "$lastXY" ] && noneStreak=$((noneStreak+1)) || { advanced=$((advanced+1)); noneStreak=0; }
                lastXY="$XY" ;;
              *)
                noneStreak=$((noneStreak+1))
                if [ "$advanced" -lt 3 ]; then
                  cliclick c:517,486 || true          # survey: pick "Claude"
                fi ;;
            esac
            screencapture -x "evidence/shots/onboard-$(printf %02d "$i").png" 2>/dev/null || true
            # Onboarding is complete once we've advanced through all ~8 screens
            # (survey, color, greeting, Let's start, Grant Mic, mic Allow, Grant
            # Access, bypass Allow, Meet HeyClicky), or Safari opened, or the card
            # is gone for a couple of iterations. Stopping at advanced>=8 keeps the
            # loop from ever touching the tutorial video / notification banners.
            if [ "$done_onboard" = 1 ] || [ "$advanced" -ge 8 ] || { [ "$advanced" -ge 6 ] && [ "$noneStreak" -ge 3 ]; }; then
              echo "onboarding complete after $i iters (advanced=$advanced, mode=$MODE)"; break
            fi
            sleep 4
          done
          # After the mic Allow the app checks Accessibility. Because we
          # pre-granted it (with csreq) before launch, a working grant means the
          # app skips the Accessibility screen and lands on Screen Recording
          # (permission 3 of 3) on its own. Observe which screen we end on.
          echo "--- tcc_write.log ---"; cat evidence/tcc_write.log
          # ---- Let intro play, click the notch "Show me" CTA, record walkthrough
          # After "Meet HeyClicky" the app plays its intro and even drives Safari
          # to Gmail on its own. The real CTA is "Show me" up in the NOTCH (top-
          # center), not the bottom-most blue element, so click it by fixed coord.
          # Auth + onboarding are done, so it is now safe to switch the default
          # audio devices to BlackHole (doing this before launch broke auth). The
          # mic step renders ~150s from here, so the app will read BlackHole as its
          # default input by then. Output -> BlackHole too, so a clip played to the
          # output loops back onto the input the app is listening to.
          echo "switching default audio to BlackHole for the mic step..."
          SwitchAudioSource -t input  -s "BlackHole 2ch" || true
          SwitchAudioSource -t output -s "BlackHole 2ch" || true
          SwitchAudioSource -c || true
          echo "letting the intro play out..."
          sleep 140
          screencapture -x evidence/shots/tutorial-end.png 2>/dev/null || true
          # Click the notch "Show me" CTA and VERIFY it worked (the end card has
          # to disappear). A blind single click raced the button's animation in
          # run 34973452861 — the walkthrough never started and the demo loop
          # then stared at the card for its whole budget.
          echo "clicking notch 'Show me' CTA (AX-first, with verify-retry)"
          ax_ok=0
          if [ -x /tmp/ax_driver ]; then
            for try in 1 2 3 4 5 6; do
              sleep 4
              R=$(/tmp/ax_driver press "show me" 2>/dev/null || echo DRIVER-ERROR)
              echo "ax showme try $try -> $R"
              case "$R" in
                PRESSED*|CLICKED*) ax_ok=1; break ;;
                NOTFOUND*|EMPTY-TREE*|NOPID*)
                  # Tree can't see the card — keep the dump as evidence.
                  /tmp/ax_driver dump > evidence/ax-tree-at-showme.log 2>/dev/null || true
                  break ;;
                *PRESS-FAILED*|DRIVER-ERROR*) ;;   # found but disabled / transient — retry
              esac
            done
          fi
          if [ "$ax_ok" != 1 ]; then
            for try in 1 2 3 4 5 6; do
              sleep 4
              screencapture -x /tmp/sm.png 2>/dev/null || true
              SXY=$(swift /tmp/find_target.swift /tmp/sm.png showme 2>/dev/null || echo NONE)
              echo "showme try $try -> $SXY"
              [ "$SXY" = "NONE" ] && break
              cliclick c:${SXY%,*},${SXY#*,} || true
            done
          fi
          screencapture -x evidence/shots/after-showme.png 2>/dev/null || true
          sleep 8   # let the demo's step-1 card render before touching its dropdown
          # The app's mic dropdown defaults to "Apple Virtual Sound Device" (it
          # does NOT follow the system default), which never receives our clip.
          # Switch it to BlackHole 2ch via the dropdown + type-select so the app
          # listens on the device the clip plays into.
          echo "selecting BlackHole 2ch in the app mic dropdown..."
          cliclick c:511,519 || true      # open the device dropdown
          sleep 1
          screencapture -x evidence/shots/dropdown-open.png 2>/dev/null || true
          # Menu opens below the pill: System Default / Apple Virtual / BlackHole
          # 2ch / Null. BlackHole is the 3rd item at ~y=608.
          cliclick c:500,608 || true       # click "BlackHole 2ch"
          sleep 1
          screencapture -x evidence/shots/after-device.png 2>/dev/null || true
          # Belt-and-suspenders: redo the selection once (idempotent) in case the
          # first dropdown click landed before the menu finished opening.
          cliclick c:511,519 || true
          sleep 1
          cliclick c:500,608 || true
          sleep 1
          screencapture -x evidence/shots/after-device-2.png 2>/dev/null || true
          # ---- Play the guided demo through (no skipping) ------------------
          # Step 1/8 is the mic check and the device dropdown was just switched
          # to BlackHole 2ch, so feed it audio: a background feeder plays the
          # prepared say-clips round-robin (system output = BlackHole = the
          # app's input, so any listening step hears a clip within ~20s). The
          # main loop clicks whatever blue button the demo puts up (Continue /
          # Next / Start) whenever it is on screen and stationary, and stops
          # when nothing has been clickable for ~1 min after we have advanced,
          # or when the ~8 min budget is spent.
          # Re-assert the audio route (idempotent): the feeder plays into the
          # system output, which must be BlackHole for the app to hear it.
          SwitchAudioSource -t input  -s "BlackHole 2ch" || true
          SwitchAudioSource -t output -s "BlackHole 2ch" || true
          echo "audio now: $(SwitchAudioSource -c 2>/dev/null || echo unknown)"
          echo "feeding the demo clips and driving the demo steps..."
          ( for r in 1 2 3 4 5 6 7 8; do
              for f in clip name draw circle dictate; do
                afplay "$HOME/$f.aiff" 2>/dev/null || true
                sleep 15
              done
            done ) &
          CLIPS=$!
          advanced=0; idleStreak=0; lastXY=""; sameCount=0
          for i in $(seq 1 90); do
            # AX-first: press the demo card's next-step button by tree.
            # AXEnabled guarantees we never click a dim Continue; the pixel
            # body below stays as the fallback when the tree misses or says no.
            ax_handled=0
            if [ -x /tmp/ax_driver ]; then
              for q in continue next start record done; do
                AR=$(/tmp/ax_driver press "$q" 2>/dev/null || echo DRIVER-ERROR)
                echo "ax demo iter $i q=$q -> $AR"
                case "$AR" in
                  PRESSED*|CLICKED*) ax_handled=1; break ;;
                  *PRESS-FAILED*) break ;;        # found but disabled — wait for live bars
                  NOTFOUND*) continue ;;
                  *) break ;;
                esac
              done
            fi
            if [ "$ax_handled" = 1 ]; then
              advanced=$((advanced+1)); idleStreak=0; lastXY=""; sameCount=0
              screencapture -x "evidence/shots/demo-$(printf %02d "$advanced").png" 2>/dev/null || true
              sleep 5
              continue
            fi
            screencapture -x /tmp/cur.png 2>/dev/null || true
            R=$(swift /tmp/find_target.swift /tmp/cur.png card 2>/dev/null || echo none)
            MODE="${R%% *}"; XY="${R#* }"
            echo "demo iter $i: $R (advanced=$advanced idle=$idleStreak)"
            case "$MODE" in
              dialog)
                cliclick c:${XY%,*},${XY#*,} || true
                advanced=$((advanced+1)); idleStreak=0 ;;
              blue)
                YT="${XY#*,}"
                if [ -n "$YT" ] && [ "$YT" -lt 160 ] 2>/dev/null; then
                  # Top-strip blue = notch CTA / overlay cursor / a skip link.
                  # Never auto-click those — the demo is played, not skipped.
                  idleStreak=$((idleStreak+1)); lastXY="$XY"; sameCount=0
                elif [ "$XY" = "$lastXY" ]; then
                  # Same spot as last iter: give the card one beat to animate,
                  # then re-click — consecutive demo steps put their button at
                  # the same coords, so a stationary target must still be
                  # driven (and a click that raced the animation gets a retry).
                  sameCount=$((sameCount+1))
                  if [ "$sameCount" -ge 2 ]; then
                    cliclick c:${XY%,*},${XY#*,} || true
                    advanced=$((advanced+1)); idleStreak=0; sameCount=0
                  else
                    idleStreak=$((idleStreak+1))
                  fi
                else
                  cliclick c:${XY%,*},${XY#*,} || true
                  advanced=$((advanced+1)); idleStreak=0
                  lastXY="$XY"; sameCount=0
                fi ;;
              *)
                # nothing clickable (or Safari being driven by the demo)
                idleStreak=$((idleStreak+1)) ;;
            esac
            screencapture -x "evidence/shots/demo-$(printf %02d "$i").png" 2>/dev/null || true
            if [ "$advanced" -ge 2 ] && [ "$idleStreak" -ge 12 ]; then
              echo "demo done (quiet) after $i iters (advanced=$advanced)"; break
            fi
            sleep 4
          done
          kill "$CLIPS" 2>/dev/null || true
          # The text toggle is ignored while the app is speaking, so let the
          # walkthrough voice finish before trying it.
          echo "letting the demo voice finish..."
          sleep 60
          /tmp/ax_driver dump > evidence/ax-final-tree.log 2>/dev/null || true
          # ---- TEXT interaction: double-tap Control to type instead of talk ----
          # The app is live and quiet (the demo voice was waited out above).
          # Double-tap Control to open the text box, type a message, send it,
          # and record the agent's reply.
          sleep 2
          # Clean control-only double-tap per the decompiled monitor: clear all
          # modifiers first (0.4s hold max, 0.5s between taps, Control-only).
          # Last guard: the tutorial/demo card must be gone before the text
          # toggle can work; if it is still up, keep dismissing it.
          for try in 1 2 3 4; do
            screencapture -x /tmp/sm.png 2>/dev/null || true
            SXY=$(swift /tmp/find_target.swift /tmp/sm.png showme 2>/dev/null || echo NONE)
            [ "$SXY" = "NONE" ] && break
            echo "card still up before text trigger; clicking $SXY"
            cliclick c:${SXY%,*},${SXY#*,} || true
            sleep 3
          done
          echo "clean control double-tap to toggle text input"
          cliclick ku:cmd,ctrl,alt,shift,fn || true
          sleep 1
          cliclick kd:ctrl w:70 ku:ctrl w:140 kd:ctrl w:70 ku:ctrl || true
          sleep 2
          screencapture -x evidence/shots/text-00-dictation.png 2>/dev/null || true
          # Belt-and-suspenders: dismiss any lingering macOS dictation prompt, retry.
          cliclick c:428,289 || true      # "Don't Ask Again" (harmless if absent)
          sleep 1
          cliclick ku:cmd,ctrl,alt,shift,fn || true
          sleep 1
          cliclick kd:ctrl w:70 ku:ctrl w:140 kd:ctrl w:70 ku:ctrl || true
          sleep 3
          screencapture -x evidence/shots/text-01-open.png 2>/dev/null || true
          echo "typing a message"
          cliclick t:"Hey Clicky, what is on my screen right now?" || true
          sleep 2
          screencapture -x evidence/shots/text-02-typed.png 2>/dev/null || true
          cliclick kp:return || true       # send
          # Let the agent respond and capture it.
          for t in $(seq -w 1 8); do
            screencapture -x "evidence/shots/text-resp-${t}.png" 2>/dev/null || true
            sleep 5
          done
          # Stop the frame-burst recorder, then stitch the frames into an mp4.
          # framerate 3 keeps it watchable.
          # Stop the ffmpeg av recorder with SIGINT so it writes a valid mp4.
          kill -INT "$AVVID" 2>/dev/null || true
          sleep 5; kill -9 "$AVVID" 2>/dev/null || true
          ls -la evidence/av.mkv 2>/dev/null; echo "--- av.log ---"; tail -5 evidence/av.log 2>/dev/null || true
          kill "$FULLVID" 2>/dev/null || true
          sleep 1
          NF=$(ls /tmp/frames/f_*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured $NF frames"
          run_to 180 ffmpeg -y -framerate 3 -pattern_type glob -i '/tmp/frames/f_*.png' \
            -c:v libx264 -pix_fmt yuv420p -vf scale=1024:-2 -movflags +faststart \
            evidence/fullrun.mp4 2>evidence/ffmpeg.log || echo "ffmpeg stitch failed"
          ls -la evidence/fullrun.mp4 2>/dev/null || true

      - name: Logs
        if: always()
        run: |
          log show --predicate 'subsystem == "com.humansongs.clicky"' --last 6m --info --debug > evidence/oslog.txt 2>&1 || true
          pkill -f HeyClicky.app || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recording
          path: evidence/**
          if-no-files-found: warn
# registration nudge: workflow file touched after enabling Actions on this copy
